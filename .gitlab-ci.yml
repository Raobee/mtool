stages:
  - build
  - release

default:
  image: debian:bookworm-slim
  interruptible: true

variables:
  GIT_DEPTH: "1"
  DEBIAN_FRONTEND: "noninteractive"
  # The build machine is in China and has no global proxy.  Switch apt to a
  # domestic mirror before installing anything.  Override if necessary.
  APT_MIRROR: "mirrors.tuna.tsinghua.edu.cn"

build:
  stage: build
  before_script:
    - |
      mirror=${APT_MIRROR#http://}
      mirror=${mirror#https://}
      mirror=${mirror%/}
      if [ -n "$mirror" ]; then
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] || continue
          sed -i "s|deb.debian.org|$mirror|g; s|security.debian.org|$mirror|g" "$f"
        done
      fi
    - apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
    - apt-get install -y -qq --no-install-recommends build-essential ca-certificates file musl-tools gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross
  script:
    - sh scripts/build-static.sh all
    - file dist/mtool.*
    - sh tests/test_mtool.sh dist/mtool.x86_64
    - readelf -h dist/mtool.aarch64 | grep -E 'Class:|Machine:|Type:'
    - readelf -h dist/mtool.armv7 | grep -E 'Class:|Machine:|Type:'
  artifacts:
    name: "mtool-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week

# Runs only for tags.  Creates a GitLab Release and attaches the static
# binaries as a job-artifact download link.  No personal access token is
# needed; the job uses CI_JOB_TOKEN.
release:
  stage: release
  interruptible: false
  rules:
    - if: '$CI_COMMIT_TAG'
  needs: [build]
  before_script:
    - |
      mirror=${APT_MIRROR#http://}
      mirror=${mirror#https://}
      mirror=${mirror%/}
      if [ -n "$mirror" ]; then
        for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
          [ -f "$f" ] || continue
          sed -i "s|deb.debian.org|$mirror|g; s|security.debian.org|$mirror|g" "$f"
        done
      fi
    - apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq
    - apt-get install -y -qq --no-install-recommends curl ca-certificates gzip
  script:
    - |
      ASSET="mtool-${CI_COMMIT_TAG}-linux-static.tar.gz"
      tar czf "$ASSET" dist README.md LICENSE
      ASSET_URL="${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/${ASSET}?job=release"
      DESC="静态链接版本：x86_64 (musl)、aarch64、armv7。r.* 的 LEN 为字节数，数字默认十六进制。"
      printf '{"name":"mtool %s","tag_name":"%s","description":"%s","assets":{"links":[{"name":"%s","url":"%s"}]}}' \
        "$CI_COMMIT_TAG" "$CI_COMMIT_TAG" "$DESC" "$ASSET" "$ASSET_URL" > release.json
      curl --fail --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
  artifacts:
    paths:
      - mtool-*-linux-static.tar.gz
    expire_in: 1 week