stages:
  - build

default:
  image: debian:bookworm-slim
  interruptible: true

variables:
  GIT_DEPTH: "1"
  DEBIAN_FRONTEND: "noninteractive"
  MTOOL_TEST_PCI: "0"

before_script:
  - apt-get update -qq
  - apt-get install -y -qq --no-install-recommends build-essential ca-certificates file musl-tools gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross

build:
  stage: build
  parallel:
    matrix:
      - ARCH: [x86_64, aarch64, armv7]
  script:
    - sh scripts/build-static.sh "$ARCH"
    - file "dist/mtool.$ARCH"
    - |
      case "$ARCH" in
        x86_64)
          # Native tests; no emulation needed.
          sh tests/test_mtool.sh "dist/mtool.$ARCH"
          ;;
        aarch64 | armv7)
          # Cross-compiled: verify the ELF architecture and that the
          # build script already rejected any dynamic NEEDED entries.
          readelf -h "dist/mtool.$ARCH" | grep -E 'Class:|Machine:|Type:'
          ;;
      esac
  artifacts:
    name: "mtool-$ARCH-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 week